server {
    listen 80;
    server_name qa.wvf-lms.com;

    client_max_body_size 2G;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=qa_limit:10m rate=10r/s;

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=qa_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /app/uploads/;
        autoindex off;
    }
}
