version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  backend:
    build: .
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
  uploads_data:
  logs_data:
